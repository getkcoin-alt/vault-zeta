name: Feature request
description: Propose a focused continuity improvement
title: "[feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What continuity problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful change
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or example
      description: A real failure mode or test case is especially useful.
  - type: dropdown
    id: trust
    attributes:
      label: Does this touch permissions, sensitive storage or identity claims?
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
